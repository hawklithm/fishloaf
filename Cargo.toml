[workspace]
resolver = "2"
members = [
    "fishloaf-tui",
    "fishloaf-server",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["fishloaf"]
license = "MIT"

[workspace.dependencies]
tokio = { version = "1", features = ["full", "tracing"] }
tokio-util = { version = "0.7", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["local-time", "env-filter", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.11", features = ["json", "cookies"] }
async-trait = "0.1"
thiserror = "1"
anyhow = "1"